# Route của API Gateway trong sandbox. Khác môi trường thật ở ba điểm:
# - đối tác xác thực bằng client_secret khi lấy mã truy cập (client credentials), chưa dùng mTLS và token gắn chứng
#   thư (RFC 8705) của FAPI 2.0;
# - Keycloak chạy chế độ dev, HTTP;
# - API dữ liệu (tài khoản, giao dịch) chuyển tới bản giả lập trên Microcks thay cho kho đọc của Integration Hub.
# Xác thực mã truy cập (openid-connect), kiểm tra consent (vobs-consent) và giới hạn tần suất (limit-count) chạy giống
# môi trường thật.
#
# openid-connect kiểm tra chữ ký token bằng khóa công khai của Keycloak (use_jwks) và issuer lấy từ discovery.
# set_userinfo_header đưa payload token đã xác thực vào header X-Userinfo; plugin vobs-consent đọc mã client (claim
# azp) từ đó để đặt biến $vobs_client_id. client_id của gateway chỉ để khai báo: kiểm tra bằng JWKS không gọi
# Keycloak bằng danh nghĩa client này.

routes:
  # Tạo, xem, thu hồi consent. proxy-rewrite đặt mã client đã xác thực vào x-vobs-client-id, ghi đè giá trị đối tác
  # tự gửi, rồi chuyển tới cổng đối tác của service consent.
  - id: consents
    uris: [/open-banking/v1/consents, /open-banking/v1/consents/*]
    methods: [GET, POST, DELETE]
    plugins:
      openid-connect:
        discovery: http://keycloak:8080/realms/open-banking/.well-known/openid-configuration
        client_id: vobs-gateway
        realm: open-banking
        bearer_only: true
        use_jwks: true
        set_userinfo_header: true
      limit-count:
        count: 30
        time_window: 60
        key_type: var
        key: vobs_client_id
        rejected_code: 429
      proxy-rewrite:
        regex_uri: ["^/open-banking/v1(/consents.*)", "$1"]
        headers:
          set:
            x-vobs-client-id: $vobs_client_id
    upstream:
      type: roundrobin
      nodes:
        "consent:8080": 1

  # API Lấy thông tin tài khoản và Lấy lịch sử giao dịch: kiểm tra consent theo đúng tài khoản trên đường dẫn
  - id: account-info
    uri: /open-banking/v1/accounts/:account_id
    methods: [GET]
    plugins:
      openid-connect:
        discovery: http://keycloak:8080/realms/open-banking/.well-known/openid-configuration
        client_id: vobs-gateway
        realm: open-banking
        bearer_only: true
        use_jwks: true
        set_userinfo_header: true
      limit-count:
        count: 30
        time_window: 60
        key_type: var
        key: vobs_client_id
        rejected_code: 429
      vobs-consent:
        consent_service_uri: http://consent:8081
        scope: ACCOUNTS_READ
        account_id_param: account_id
      proxy-rewrite:
        regex_uri: ["^/open-banking/v1/(.*)", "/rest/VOBS+Open+API/0.2.0-draft/$1"]
    upstream:
      type: roundrobin
      nodes:
        "microcks:8080": 1

  - id: account-transactions
    uri: /open-banking/v1/accounts/:account_id/transactions
    methods: [GET]
    plugins:
      openid-connect:
        discovery: http://keycloak:8080/realms/open-banking/.well-known/openid-configuration
        client_id: vobs-gateway
        realm: open-banking
        bearer_only: true
        use_jwks: true
        set_userinfo_header: true
      limit-count:
        count: 30
        time_window: 60
        key_type: var
        key: vobs_client_id
        rejected_code: 429
      vobs-consent:
        consent_service_uri: http://consent:8081
        scope: TRANSACTIONS_READ
        account_id_param: account_id
      proxy-rewrite:
        regex_uri: ["^/open-banking/v1/(.*)", "/rest/VOBS+Open+API/0.2.0-draft/$1"]
    upstream:
      type: roundrobin
      nodes:
        "microcks:8080": 1
#END
