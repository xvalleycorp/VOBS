# Route của API Gateway trong sandbox. ./pki.sh ghép thêm đối tượng SSL (chứng thư máy chủ, CA xác thực client) và
# ghi ra pki/apisix.yaml; gateway đọc file đó. Khác môi trường thật ở hai điểm:
# - PKI là CA tự ký của sandbox, Keycloak chạy chế độ dev;
# - API dữ liệu (tài khoản, giao dịch) chuyển tới bản giả lập trên Microcks thay cho kho đọc của Integration Hub.
# mTLS, mã truy cập gắn chứng thư (FAPI 2.0, RFC 8705), kiểm tra consent và giới hạn tần suất chạy giống môi trường thật.
#
# openid-connect hỏi Keycloak về token qua endpoint introspection, nên token ký PS256 và token bị thu hồi đều được xử
# lý đúng. Gateway xác thực với Keycloak bằng JWT ký bằng khóa riêng (private_key_jwt, ES256); ./pki.sh tạo khóa và
# ghép vào chỗ __GATEWAY_CLIENT_KEY__. Thư viện mặc định giữ kết quả tới khi token hết hạn, nên phải đặt
# introspection_interval: sandbox để 1 giây để kiểm tra thu hồi. aud phải chứa client_id của gateway (vobs-gateway).
# set_userinfo_header đưa kết quả introspection vào header X-Userinfo, nơi vobs-fapi đọc claim cnf và vobs-consent đọc
# mã client (claim azp). vobs-fapi so cnf["x5t#S256"] với chứng thư client của kết nối mTLS.

routes:
  # Tạo, xem, thu hồi consent. proxy-rewrite đặt mã client đã xác thực vào x-vobs-client-id, ghi đè giá trị đối tác
  # tự gửi, rồi chuyển tới cổng đối tác của service consent.
  - id: consents
    uris: [/open-banking/v1/consents, /open-banking/v1/consents/*]
    methods: [GET, POST, DELETE]
    plugins:
      openid-connect:
        discovery: http://keycloak:8080/realms/open-banking/.well-known/openid-configuration
        client_id: vobs-gateway
        realm: open-banking
        bearer_only: true
        introspection_endpoint_auth_method: private_key_jwt
        client_rsa_private_key: "__GATEWAY_CLIENT_KEY__"
        client_rsa_private_key_id: vobs-gateway-1
        client_jwt_assertion_alg: ES256
        client_jwt_assertion_audience: https://localhost:8443/realms/open-banking
        client_jwt_assertion_expires_in: 30
        introspection_interval: 1
        set_userinfo_header: true
        claim_validator:
          audience:
            match_with_client_id: true
      vobs-fapi: {}
      limit-count:
        count: 30
        time_window: 60
        key_type: var
        key: vobs_client_id
        rejected_code: 429
      proxy-rewrite:
        regex_uri: ["^/open-banking/v1(/consents.*)", "$1"]
        headers:
          set:
            x-vobs-client-id: $vobs_client_id
    upstream:
      type: roundrobin
      nodes:
        "consent:8080": 1

  # API Lấy thông tin tài khoản và Lấy lịch sử giao dịch: kiểm tra consent theo đúng tài khoản trên đường dẫn
  - id: account-info
    uri: /open-banking/v1/accounts/:account_id
    methods: [GET]
    plugins:
      openid-connect:
        discovery: http://keycloak:8080/realms/open-banking/.well-known/openid-configuration
        client_id: vobs-gateway
        realm: open-banking
        bearer_only: true
        introspection_endpoint_auth_method: private_key_jwt
        client_rsa_private_key: "__GATEWAY_CLIENT_KEY__"
        client_rsa_private_key_id: vobs-gateway-1
        client_jwt_assertion_alg: ES256
        client_jwt_assertion_audience: https://localhost:8443/realms/open-banking
        client_jwt_assertion_expires_in: 30
        introspection_interval: 1
        set_userinfo_header: true
        claim_validator:
          audience:
            match_with_client_id: true
      vobs-fapi: {}
      limit-count:
        count: 30
        time_window: 60
        key_type: var
        key: vobs_client_id
        rejected_code: 429
      vobs-consent:
        consent_service_uri: http://consent:8081
        scope: ACCOUNTS_READ
        account_id_param: account_id
      proxy-rewrite:
        regex_uri: ["^/open-banking/v1/(.*)", "/rest/VOBS+Open+API/0.2.0-draft/$1"]
    upstream:
      type: roundrobin
      nodes:
        "microcks:8080": 1

  - id: account-transactions
    uri: /open-banking/v1/accounts/:account_id/transactions
    methods: [GET]
    plugins:
      openid-connect:
        discovery: http://keycloak:8080/realms/open-banking/.well-known/openid-configuration
        client_id: vobs-gateway
        realm: open-banking
        bearer_only: true
        introspection_endpoint_auth_method: private_key_jwt
        client_rsa_private_key: "__GATEWAY_CLIENT_KEY__"
        client_rsa_private_key_id: vobs-gateway-1
        client_jwt_assertion_alg: ES256
        client_jwt_assertion_audience: https://localhost:8443/realms/open-banking
        client_jwt_assertion_expires_in: 30
        introspection_interval: 1
        set_userinfo_header: true
        claim_validator:
          audience:
            match_with_client_id: true
      vobs-fapi: {}
      limit-count:
        count: 30
        time_window: 60
        key_type: var
        key: vobs_client_id
        rejected_code: 429
      vobs-consent:
        consent_service_uri: http://consent:8081
        scope: TRANSACTIONS_READ
        account_id_param: account_id
      proxy-rewrite:
        regex_uri: ["^/open-banking/v1/(.*)", "/rest/VOBS+Open+API/0.2.0-draft/$1"]
    upstream:
      type: roundrobin
      nodes:
        "microcks:8080": 1
#END
