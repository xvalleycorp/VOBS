# Thay cho kho đọc của Integration Hub: trả cố định, gần như không tốn CPU, để kết quả phản ánh gateway, Keycloak và
# service consent. Nội dung 4 KB theo giả định trong docs/infrastructure.md.
server {
    listen 8080;
    keepalive_requests 100000;
    location / {
        default_type application/json;
        root /usr/share/nginx/html;
        try_files /body.json =404;
    }
}
