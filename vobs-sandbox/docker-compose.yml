# Sandbox cục bộ cho bên thứ ba (fintech, ví điện tử):
# - Microcks dựng API giả lập từ bộ đặc tả trong vobs-spec;
# - service Quản lý sự đồng ý chạy thật, lưu trong bộ nhớ, để thử trọn luồng tạo, duyệt, kiểm tra consent;
# - Keycloak cấp mã truy cập OAuth 2.0 (client credentials) cho đối tác mẫu;
# - API Gateway (Apache APISIX) xác thực mã truy cập và kiểm tra consent: đối tác gọi qua gateway như ở môi trường thật.
#
#   docker compose up -d --build
#   ./import-specs.sh        # nạp đặc tả và dữ liệu mẫu vào Microcks
#   ./try-consent-flow.sh    # chạy thử luồng consent, gọi thẳng service
#   ./try-gateway-flow.sh    # chạy thử luồng qua API Gateway
#   ./try-sandbox-data.sh    # kiểm tra dữ liệu mẫu
#
# Giao diện Microcks: http://localhost:8585; Keycloak: http://localhost:8180; API Gateway: http://localhost:9080/open-banking/v1
services:
  microcks:
    image: quay.io/microcks/microcks-uber:1.14.0
    ports:
      - "8585:8080"
    restart: unless-stopped

  consent:
    image: vobs-consent:sandbox
    build:
      context: ..
      dockerfile: vobs-consent/Dockerfile
    environment:
      # Đối tác mẫu: fintech chỉ dùng được nhóm truy vấn thông tin; ví điện tử và ngân hàng dùng được nhóm thanh toán
      VOBS_CONSENT_THIRD_PARTIES: "fintech-a:OTHER,wallet-b:PAYMENT_INTERMEDIARY,bank-c:BANK"
    ports:
      # Cổng đối tác. Ở môi trường thật, đối tác gọi qua API Gateway và gateway đặt header x-vobs-client-id;
      # trong sandbox, đối tác tự gửi header này.
      - "127.0.0.1:8090:8080"
      # Cổng nội bộ, đóng vai kênh của ngân hàng (khách hàng duyệt, thu hồi consent) và gateway (kiểm tra consent).
      # Chỉ mở trên localhost.
      - "127.0.0.1:8091:8081"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    # Chế độ dev: HTTP, lưu trong bộ nhớ; realm open-banking nạp từ keycloak/open-banking-realm.json khi khởi động
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Issuer của token luôn là http://localhost:8180, địa chỉ đối tác dùng để lấy token. Gateway gọi Keycloak qua
      # mạng nội bộ (http://keycloak:8080); với backchannel động, discovery trả jwks_uri theo địa chỉ nội bộ đó.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./keycloak/open-banking-realm.json:/opt/keycloak/data/import/open-banking-realm.json:ro
    ports:
      - "127.0.0.1:8180:8080"
    restart: unless-stopped

  gateway:
    image: apache/apisix:3.19.0-debian
    depends_on: [consent, microcks, keycloak]
    environment:
      # Chạy standalone: route đọc từ gateway/apisix.yaml, không cần etcd
      APISIX_STAND_ALONE: "true"
    volumes:
      - ./gateway/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./gateway/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ../vobs-gateway/apisix/plugins:/opt/vobs/apisix/plugins:ro
    ports:
      - "127.0.0.1:9080:9080"
    restart: unless-stopped
