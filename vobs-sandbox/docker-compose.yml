# Sandbox cục bộ cho bên thứ ba (fintech, ví điện tử):
# - Microcks dựng API giả lập từ bộ đặc tả trong vobs-spec;
# - service Quản lý sự đồng ý chạy thật, lưu trong bộ nhớ, để thử trọn luồng tạo, duyệt, kiểm tra consent;
# - API Gateway (Apache APISIX) với plugin vobs-consent: đối tác gọi qua gateway như ở môi trường thật.
#
#   docker compose up -d --build
#   ./import-specs.sh        # nạp đặc tả vào Microcks
#   ./try-consent-flow.sh    # chạy thử luồng consent, gọi thẳng service
#   ./try-gateway-flow.sh    # chạy thử luồng qua API Gateway
#
# Giao diện Microcks: http://localhost:8585; API Gateway: http://localhost:9080/open-banking/v1
services:
  microcks:
    image: quay.io/microcks/microcks-uber:1.14.0
    ports:
      - "8585:8080"
    restart: unless-stopped

  consent:
    image: vobs-consent:sandbox
    build:
      context: ..
      dockerfile: vobs-consent/Dockerfile
    environment:
      # Đối tác mẫu: fintech chỉ dùng được nhóm truy vấn thông tin; ví điện tử và ngân hàng dùng được nhóm thanh toán
      VOBS_CONSENT_THIRD_PARTIES: "fintech-a:OTHER,wallet-b:PAYMENT_INTERMEDIARY,bank-c:BANK"
    ports:
      # Cổng đối tác. Ở môi trường thật, đối tác gọi qua API Gateway và gateway đặt header x-vobs-client-id;
      # trong sandbox, đối tác tự gửi header này.
      - "127.0.0.1:8090:8080"
      # Cổng nội bộ, đóng vai kênh của ngân hàng (khách hàng duyệt, thu hồi consent) và gateway (kiểm tra consent).
      # Chỉ mở trên localhost.
      - "127.0.0.1:8091:8081"
    restart: unless-stopped

  gateway:
    image: apache/apisix:3.19.0-debian
    depends_on: [consent, microcks]
    environment:
      # Chạy standalone: route đọc từ gateway/apisix.yaml, không cần etcd
      APISIX_STAND_ALONE: "true"
    volumes:
      - ./gateway/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./gateway/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ../vobs-gateway/apisix/plugins:/opt/vobs/apisix/plugins:ro
    ports:
      - "127.0.0.1:9080:9080"
    restart: unless-stopped
