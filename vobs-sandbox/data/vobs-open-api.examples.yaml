# Dữ liệu mẫu cho API giả lập trên Microcks (artifact phụ, nạp sau đặc tả bằng ../import-specs.sh). Bổ sung cho các
# `examples` trong đặc tả: đặc tả giữ mỗi API một ví dụ để làm tài liệu, file này thêm khách hàng, tài khoản, giao dịch
# và tình huống lỗi để bên thứ ba thử tích hợp.
#
# Mọi số liệu là giả: số tài khoản, số dư, lãi suất, tỷ giá không phản ánh ngân hàng nào; ngân hàng mẫu dùng BIN giả
# 999901 (CONTRIBUTING.md). Danh mục dữ liệu ở
# ../README.md. Tên example phải khác với tên trong đặc tả cho cùng một bộ tham số, để Microcks không có hai phản hồi
# cho một request.
#
# metadata.version phải trùng info.version của vobs-spec/openapi/vobs-open-api.yaml, nếu không Microcks bỏ qua file.
apiVersion: mocks.microcks.io/v1alpha1
kind: APIExamples
metadata:
  name: VOBS Open API
  version: 0.2.0-draft
operations:
  # ------------------------------------------------------------------ Điểm a: lãi suất, tỷ giá
  'GET /interest-rates':
    term-deposit:
      request:
        parameters:
          productType: TERM_DEPOSIT
      response:
        mediaType: application/json
        body:
          effectiveAt: '2026-10-24T00:00:00+07:00'
          data:
            - { productType: TERM_DEPOSIT, term: P1M, currency: VND, annualRatePercent: '2.10' }
            - { productType: TERM_DEPOSIT, term: P3M, currency: VND, annualRatePercent: '2.40' }
            - { productType: TERM_DEPOSIT, term: P6M, currency: VND, annualRatePercent: '4.70' }
            - { productType: TERM_DEPOSIT, term: P12M, currency: VND, annualRatePercent: '5.20' }
            - { productType: TERM_DEPOSIT, term: P24M, currency: VND, annualRatePercent: '5.40' }
            - { productType: TERM_DEPOSIT, term: P12M, currency: USD, annualRatePercent: '0.00' }
    savings-account:
      request:
        parameters:
          productType: SAVINGS
      response:
        mediaType: application/json
        body:
          effectiveAt: '2026-10-24T00:00:00+07:00'
          data:
            - { productType: SAVINGS, currency: VND, annualRatePercent: '0.10' }
    loan:
      request:
        parameters:
          productType: LOAN
      response:
        mediaType: application/json
        body:
          effectiveAt: '2026-10-24T00:00:00+07:00'
          data:
            - { productType: LOAN, term: P12M, currency: VND, annualRatePercent: '7.50' }
            - { productType: LOAN, term: P60M, currency: VND, annualRatePercent: '9.20' }

  'GET /exchange-rates':
    currency-usd:
      request:
        parameters:
          currency: USD
      response:
        mediaType: application/json
        body:
          effectiveAt: '2026-10-24T08:30:00+07:00'
          data:
            - { currency: USD, cashBuy: '26050', transferBuy: '26080', sell: '26420' }
    currency-eur:
      request:
        parameters:
          currency: EUR
      response:
        mediaType: application/json
        body:
          effectiveAt: '2026-10-24T08:30:00+07:00'
          data:
            - { currency: EUR, cashBuy: '28120', transferBuy: '28400', sell: '29650' }
    currency-jpy:
      request:
        parameters:
          currency: JPY
      response:
        mediaType: application/json
        body:
          effectiveAt: '2026-10-24T08:30:00+07:00'
          data:
            - { currency: JPY, cashBuy: '168.20', transferBuy: '169.90', sell: '178.30' }

