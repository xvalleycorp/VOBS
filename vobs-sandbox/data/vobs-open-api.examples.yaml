  # ------------------------------------------------------------------ Điểm c(i): trạng thái thanh toán
  'GET /payments/{paymentId}':
    rejected:
      request:
        parameters:
          paymentId: pay-20261024-0002
      response:
        mediaType: application/json
        body:
          paymentId: pay-20261024-0002
          status: REJECTED
          authenticationFlow: REDIRECT
          # Mã lý do ISO 20022 ExternalStatusReason1Code: AM04 là không đủ số dư
          reasonCode: AM04
          createdAt: '2026-10-24T10:20:00+07:00'
    awaiting:
      request:
        parameters:
          paymentId: pay-20261024-0003
      response:
        mediaType: application/json
        body:
          paymentId: pay-20261024-0003
          status: AWAITING_AUTHENTICATION
          authenticationFlow: DECOUPLED
          createdAt: '2026-10-24T10:30:00+07:00'
    unknown:
      request:
        parameters:
          paymentId: pay-20261024-0004
      response:
        mediaType: application/json
        body:
          # Chưa nhận được kết quả từ hệ thống chuyển mạch; bên thứ ba hỏi lại sau, không tạo lệnh mới
          paymentId: pay-20261024-0004
          status: UNKNOWN
          authenticationFlow: REDIRECT
          createdAt: '2026-10-24T10:40:00+07:00'
    not-found:
      request:
        parameters:
          paymentId: pay-00000000-0000
      response:
        status: '404'
        mediaType: application/problem+json
        body:
