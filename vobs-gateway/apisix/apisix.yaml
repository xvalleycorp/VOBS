# Ví dụ cấu hình route ở chế độ standalone của Apache APISIX cho API Lấy thông tin tài khoản
# (Điều 6 khoản 1 điểm b Thông tư 64/2024/TT-NHNN).
# Thứ tự plugin theo priority: openid-connect (2599, xác thực token FAPI) -> limit-count (1002) -> vobs-consent (999).
# limit-count giới hạn truy vấn tự động theo từng bên thứ ba (Điều 11).
# kafka-logger ghi log mọi lần sử dụng Open API; topic giữ tối thiểu 3 tháng và được sao lưu tối thiểu 1 năm
# (Điều 11), lưu kiểu WORM.
# Các giá trị trong <...> thay theo môi trường của ngân hàng.
routes:
  - id: account-info
    uri: /open-banking/v1/accounts/:account_id
    methods: [GET]
    plugins:
      openid-connect:
        discovery: https://<keycloak-host>/realms/open-banking/.well-known/openid-configuration
        client_id: vobs-gateway
        client_secret: <từ OpenBao>
        bearer_only: true
        use_jwks: true
        # Bắt buộc: vobs-consent đọc mã client (claim azp) từ X-Userinfo do openid-connect đặt
        set_userinfo_header: true
      limit-count:
        count: 60
        time_window: 60
        key_type: var
        key: vobs_client_id
        rejected_code: 429
        show_limit_quota_header: true
      vobs-consent:
        consent_service_uri: https://vobs-consent.vobs.svc:8443
        scope: ACCOUNTS_READ
        account_id_param: account_id
      kafka-logger:
        brokers:
          - host: vobs-kafka-bootstrap.vobs.svc
            port: 9093
        kafka_topic: vobs.audit.api
        batch_max_size: 1
        log_format:
          ts: $time_iso8601
          request_id: $request_id
          interaction_id: $http_x_fapi_interaction_id
          client_id: $vobs_client_id
          consent_id: $vobs_consent_id
          method: $request_method
          uri: $uri
          status: $status
          latency_ms: $request_time
    upstream:
      type: roundrobin
      nodes:
        vobs-read-api.vobs.svc:8080: 1

  # Tạo, xem, thu hồi consent (Điều 6 khoản 1 điểm b). Đối tác dùng mã truy cập client_credentials của chính mình,
  # nên không có vobs-consent. proxy-rewrite đặt mã client đã xác thực vào x-vobs-client-id, ghi đè giá trị đối tác
  # tự gửi, rồi bỏ tiền tố trước khi chuyển tới cổng đối tác của service consent (Service Kubernetes
  # vobs-consent-partner). Cổng nội bộ (Service vobs-consent, nơi plugin vobs-consent gọi /internal/consent-checks)
  # không nhận route nào từ đối tác.
  - id: consents
    uris: [/open-banking/v1/consents, /open-banking/v1/consents/*]
    methods: [GET, POST, DELETE]
    plugins:
      openid-connect:
        discovery: https://<keycloak-host>/realms/open-banking/.well-known/openid-configuration
        client_id: vobs-gateway
        client_secret: <từ OpenBao>
        bearer_only: true
        use_jwks: true
        # Bắt buộc: $vobs_client_id lấy mã client (claim azp) từ X-Userinfo do openid-connect đặt
        set_userinfo_header: true
      limit-count:
        count: 60
        time_window: 60
        key_type: var
        key: vobs_client_id
        rejected_code: 429
        show_limit_quota_header: true
      proxy-rewrite:
        regex_uri: ["^/open-banking/v1(/consents.*)", "$1"]
        headers:
          set:
            x-vobs-client-id: $vobs_client_id
      kafka-logger:
        brokers:
          - host: vobs-kafka-bootstrap.vobs.svc
            port: 9093
        kafka_topic: vobs.audit.api
        batch_max_size: 1
        log_format:
          ts: $time_iso8601
          request_id: $request_id
          interaction_id: $http_x_fapi_interaction_id
          client_id: $vobs_client_id
          method: $request_method
          uri: $uri
          status: $status
          latency_ms: $request_time
    upstream:
      type: roundrobin
      scheme: https
      nodes:
        vobs-consent-partner.vobs.svc:8443: 1
#END
