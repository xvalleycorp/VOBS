name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', 'vobs-spec/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'vobs-spec/**', '.github/workflows/website.yml']

permissions:
  contents: read

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy lên vobs.dxa.io.vn
        if: github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
